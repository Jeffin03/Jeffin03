<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Resume | Restricted</title>
<link rel="icon" href="assets/img/logo_crop.png">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .gate{
    min-height:calc(100vh - 121px);
    display:flex; align-items:center; justify-content:center; padding:40px 24px;
  }
  .gate-card{
    max-width:420px; width:100%; text-align:center;
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:40px 32px;
  }
  .gate-lock{
    width:64px; height:64px; margin:0 auto 18px; border-radius:16px;
    background:var(--navy); border:1px solid var(--blue);
    display:flex; align-items:center; justify-content:center; font-size:28px;
  }
  .gate-card h1{ font-size:20px; margin-bottom:8px; }
  .gate-card p{ color:var(--muted); font-size:14px; margin-bottom:24px; }
  .gate-form{ display:flex; flex-direction:column; gap:12px; }
  .gate-form input{
    padding:13px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); font-size:15px; outline:none;
  }
  .gate-form input:focus{ border-color:var(--blue); }
  .gate-form button{
    padding:13px; border-radius:10px; border:1px solid var(--blue);
    background:var(--navy); color:#fff; font-size:15px; font-weight:600; cursor:pointer;
  }
  .gate-form button:hover{ background:var(--navy-2); color:var(--accent); }
  .gate-error{ display:none; color:#ff7b7b; font-size:13.5px; margin-top:2px; }
  .gate-hint{ margin-top:18px; font-size:12.5px; color:var(--muted); }
  .gate-hint a{ color:var(--blue-2); }

  .resume-wrap{ display:none; padding:24px 12px 60px; max-width:210mm; margin:0 auto; }

  .resume-toolbar{
    display:none; flex-wrap:wrap; align-items:center; gap:8px;
    position:relative; margin-bottom:12px;
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px;
  }
  .resume-toolbar.open{ display:flex; }
  .tb-left, .tb-right{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .tb-right{ margin-left:auto; }
  .resume-toolbar button{
    border:1px solid var(--line); background:var(--bg-2); color:var(--ink);
    padding:8px 13px; border-radius:8px; cursor:pointer; font-size:13px;
  }
  .resume-toolbar button:hover{ border-color:var(--blue); color:var(--accent); }
  .resume-toolbar button.primary{ background:var(--navy); color:#fff; border-color:var(--blue); }
  .resume-toolbar button.primary:hover{ background:var(--navy-2); color:var(--accent); }
  .tb-status{ font-size:12px; color:var(--muted); }
  .tb-status.saved{ color:var(--accent); }

  .history-panel{
    display:none; position:absolute; top:calc(100% - 4px); left:12px; z-index:20;
    width:min(420px, 90vw); max-height:340px; overflow:auto;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    box-shadow:0 18px 50px rgba(0,0,0,.5); padding:12px;
  }
  .history-panel.open{ display:block; }
  .hist-head{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:8px; }
  .hist-head b{ font-size:13.5px; }
  .hist-head span{ font-size:11px; color:var(--muted); }
  .hist-empty{ font-size:12.5px; color:var(--muted); padding:6px 0; }
  .hist-row{ display:flex; align-items:center; gap:8px; padding:7px 0; border-top:1px solid var(--line); }
  .hist-meta{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
  .hist-meta b{ font-size:12.5px; font-weight:600; }
  .hist-meta span{ font-size:11px; color:var(--muted); }
  .hist-row button{ padding:5px 10px; font-size:12px; }
  .hist-row button.ghost{ background:transparent; color:var(--muted); }

  #resumeFrame{ width:100%; border:none; background:#fff; border-radius:10px; box-shadow:0 6px 30px rgba(0,0,0,.4); }
</style>
</head>
<body>

<nav class="nav">
  <div class="container">
    <a class="brand" href="index.html">Jeffin<span>.dev</span></a>
    <div class="nav-links">
      <a href="index.html">Portfolio</a>
      <a href="index.html#projects">Projects</a>
      <a href="index.html#contact">Contact</a>
    </div>
  </div>
</nav>

<main>
  <div class="gate" id="gate">
    <div class="gate-card">
      <div class="gate-lock">&#128274;</div>
      <h1>Restricted Area</h1>
      <p>This page is encrypted. Enter the passphrase to view and edit the resume.</p>
      <form class="gate-form" id="gateForm">
        <input type="password" id="passphrase" placeholder="Passphrase" autocomplete="off" required>
        <div class="gate-error" id="gateError">Incorrect passphrase. Try again.</div>
        <button type="submit">Unlock</button>
      </form>
      <div class="gate-hint">Only the passphrase holder can access this. <a href="index.html">Back to portfolio</a></div>
    </div>
  </div>

  <div class="resume-wrap" id="resumeWrap">
    <div class="resume-toolbar" id="resumeToolbar">
      <div class="tb-left">
        <button id="btnSave" class="primary" type="button">Save version</button>
        <button id="btnHistory" type="button">History</button>
        <button id="btnSig" type="button">Upload signature</button>
        <button id="btnExport" type="button">Export HTML</button>
        <button id="btnRevert" type="button">Revert to original</button>
      </div>
      <div class="tb-right">
        <span class="tb-status" id="resumeStatus">Ready</span>
        <button id="btnPrint" type="button">Print / Save as PDF</button>
      </div>

      <input type="file" id="sigInput" accept="image/*" hidden>

      <div class="history-panel" id="historyPanel">
        <div class="hist-head">
          <b>Version history</b>
          <span>saved in this browser</span>
        </div>
        <div class="hist-list" id="historyList"></div>
      </div>
    </div>

    <iframe id="resumeFrame" title="Resume"></iframe>
  </div>
</main>

<script src="assets/js/resume-data.js"></script>
<script src="assets/js/resume.js"></script>
</body>
</html>
